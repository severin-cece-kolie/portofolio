name: Deploy Portfolio to srv-local

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-srv-local
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy website on srv-local
        run: sudo -n /opt/tulip/deploy.sh

